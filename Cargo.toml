[package]
name = "thomeauth"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Stateful Rust client for ThomeAuth"
repository = "https://github.com/psyche314/thomeauth"
readme = "README.md"
keywords = ["thomeauth", "licensing", "api-client"]
categories = ["api-bindings"]

[dependencies]
chacha20poly1305 = "0.10"
curve25519-dalek = "4.1"
ed25519-dalek = "2.2"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
url = "2.5"
zeroize = "1.8"

[lints.rust]
unsafe_code = "forbid"
